# Configuration légère des outils (pas de packaging : le projet n'est pas installé).
# Les dépendances sont déclarées dans requirements.txt.

[project]
name = "student-success-prediction"
version = "0.1.0"
description = "SAÉ 5.03 Data Mining — prédiction du statut académique des étudiants (projet pédagogique)."
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".ipynb_checkpoints"]

[tool.ruff.lint]
# E/W : pycodestyle · F : pyflakes · I : tri des imports · B : bugbear · UP : pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
